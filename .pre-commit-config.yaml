# Install once: pre-commit install --hook-type pre-commit --hook-type pre-push
# Fast checks on commit, heavier checks (types, tests) on push.
# Every remote revision is frozen to a full commit SHA; the tag is kept in a comment for humans.
# Bump with `pre-commit autoupdate --freeze` and review the diff.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
        exclude: (tsconfig.*\.json|\.devcontainer/devcontainer\.json)$
      - id: check-toml
      # The vendored KVS bundle is pinned by SHA-256 (ADR 0026): whitespace fixers must not touch it.
      - id: end-of-file-fixer
        exclude: ^(apps/robot-video/public/vendor/|apps/console/public/vendor/|agent/src/fleet_agent/video/static/)
      - id: trailing-whitespace
        exclude: ^(apps/robot-video/public/vendor/|apps/console/public/vendor/|agent/src/fleet_agent/video/static/)
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=1500]
      - id: detect-private-key
      # detect-aws-credentials only flags credentials already present in ~/.aws/credentials or the
      # environment; it does no pattern matching. gitleaks below is the real secret detector.
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730 # frozen: v0.17.1 (same version as agent dev dependency)
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^agent/
      - id: ruff-format
        files: ^agent/

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: 4c4437d784e93cacb1f05f1d7bc28e4354fafd20 # frozen: v1.109.4
    hooks:
      - id: terraform_fmt
      - id: terraform_tflint
        args: [--args=--config=__GIT_WORKING_DIR__/.tflint.hcl]

  - repo: local
    hooks:
      - id: prettier
        name: prettier (check)
        entry: pnpm exec prettier --check --ignore-unknown
        language: system
        types_or: [ts, tsx, javascript, json, css, markdown, yaml]
      - id: eslint
        name: eslint
        entry: pnpm exec eslint --max-warnings=0 --no-warn-ignored
        language: system
        types_or: [ts, tsx, javascript]
      - id: typecheck
        name: tsc (all packages)
        entry: pnpm typecheck
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: mypy
        name: mypy --strict (agent)
        entry: bash -c 'cd agent && uv run mypy --strict src'
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: unit-tests
        name: unit tests (TS + Python)
        entry: bash -c 'pnpm test && (cd agent && uv run pytest -q)'
        language: system
        pass_filenames: false
        stages: [pre-push]
