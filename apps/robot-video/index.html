<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Robot camera</title>
    <script
      src="/vendor/kvs-webrtc.min.js"
      integrity="sha384-G0UVZqeJomjXpY5peRUwBuzPruXUFJL+R5KJnpICQUxKUfZdMDKZk7xIW+2H78B3"
    ></script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="banner" class="banner" hidden></div>
    <main>
      <h1 data-i18n="title">Robot camera</h1>
      <p id="status" role="status" aria-live="polite" data-state="idle"></p>
      <ul id="tags" class="tags"></ul>
      <p id="viewers" class="meta"></p>
      <p id="expiry" class="meta"></p>
      <p id="capture-settings" class="meta"></p>
      <video id="local-video" autoplay muted playsinline data-i18n-label="camera.preview"></video>
      <p class="controls">
        <button id="retry-camera" type="button" data-i18n="camera.retry" hidden>
          Retry camera
        </button>
        <button id="stop" type="button" data-i18n="button.stop">Stop</button>
      </p>
    </main>
  </body>
</html>
