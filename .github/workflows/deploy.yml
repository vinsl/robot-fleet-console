# Deploys main to the demo environment after the CI and security gates passed on main.
# Guard: refuses any plan that deletes or replaces a resource unless the owner re-runs it
# manually with allow_destroy=true. Then smoke tests, rollback on failure, e2e and DAST.
# Gated by the DEPLOY_ENABLED repository variable: every job is skipped while it is unset.
# Set DEPLOY_ENABLED=true only after infra/envs/demo is merged: smoke reads its CloudTrail and SNS
# topic outputs, and nothing can deploy before that root exists.
# Repository variables read by this workflow: AWS_REGION, AWS_DEPLOY_ROLE_ARN (the deploy role
# created by infra/bootstrap) and AWS_E2E_ROLE_ARN (the e2e role, created by infra/bootstrap: the e2e
# job is skipped until it is set).
# The make targets called below exist. publish-console and rollback fail honestly until the console
# milestone; e2e-setup, e2e and e2e-teardown ship in M10.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_destroy:
        description: "Allow a plan that deletes or replaces resources (the owner only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Per ref, so a manual run on another branch can never displace a queued deploy of main.
  group: deploy-demo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Calls the CI workflow on this exact commit instead of trusting a workflow_run event,
  # so the deployed code is always the code that passed the gate.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # On the GitHub Free plan merges are not blocked by required checks (ADR 0003), so the
  # deploy itself must wait for the security gate: a red Gitleaks or Trivy never reaches AWS.
  security:
    name: Security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  deploy:
    name: Deploy demo
    needs: [ci, security]
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      console_url: ${{ steps.outputs.outputs.console_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile && pnpm build
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.17"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: deploy-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Plan
        working-directory: infra/envs/demo
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color -out=tfplan
      - name: Destroy guard
        working-directory: infra/envs/demo
        # bash enables pipefail; each command is separate so a failing `terraform show`
        # fails the guard closed instead of producing an empty list of deletions.
        shell: bash
        env:
          ALLOW_DESTROY: ${{ inputs.allow_destroy || false }}
        run: |
          terraform show -json tfplan > "$RUNNER_TEMP/plan.json"
          destroys=$(jq -r '[.resource_changes[]? | select(.change.actions | index("delete")) | .address] | join(", ")' "$RUNNER_TEMP/plan.json")
          if [ -n "$destroys" ] && [ "$ALLOW_DESTROY" != "true" ]; then
            echo "::error::Plan deletes or replaces: $destroys. Re-run this workflow manually with allow_destroy=true after review."
            exit 1
          fi
      - name: Apply
        id: apply
        working-directory: infra/envs/demo
        run: terraform apply -input=false -no-color tfplan
      - id: outputs
        working-directory: infra/envs/demo
        # bash enables pipefail: a failing `terraform output` fails the step. An empty origin fails it too: it used
        # to be read from an output that does not exist, which silently skipped the e2e and DAST jobs.
        # The console is published from the operator's SSO session, never from CI (THREAT_MODEL T38, R55).
        shell: bash
        run: |
          console_url="$(terraform output -json | jq -r '.console_origin.value // empty')"
          [ -n "$console_url" ] || { echo "::error::console_origin is missing from the stack outputs"; exit 1; }
          echo "console_url=$console_url" >> "$GITHUB_OUTPUT"
      - name: Smoke tests
        id: smoke
        run: make smoke
      - name: Roll back after a failed publish or smoke test
        if: failure() && steps.apply.outcome == 'success'
        run: make rollback

  e2e:
    name: E2E (Playwright)
    needs: deploy
    if: needs.deploy.outputs.console_url != '' && vars.AWS_E2E_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: pnpm install --frozen-lockfile && pnpm --filter @mfc/console exec playwright install --with-deps chromium
      # The simulator runs from the agent project (ADR 0069): its dependencies are synced before the role is assumed.
      # The job holds id-token: write during this install, like the pnpm install above: the lockfile is hashed and
      # `--frozen` forbids any resolution, which is the accepted mitigation (THREAT_MODEL T-E2).
      - run: uv sync --project agent --frozen
      # Assumed after the installs, so no AWS credential is in the environment while dependencies
      # install. id-token: write is granted to the whole job, so an install script could still request
      # an OIDC token: install scripts are limited to esbuild (strictDepBuilds and onlyBuiltDependencies
      # in pnpm-workspace.yaml). e2e has its own least-privilege role, not the deploy role (THREAT_MODEL R7).
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_E2E_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: e2e-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Create ephemeral e2e user and robot
        timeout-minutes: 5
        run: make e2e-setup
        env:
          # The setup reads config.json from the console to find the user pool.
          CONSOLE_URL: ${{ needs.deploy.outputs.console_url }}
      - name: Playwright
        timeout-minutes: 8
        run: make e2e
        env:
          CONSOLE_URL: ${{ needs.deploy.outputs.console_url }}
      # Runs even when the scenario failed, so no e2e user or robot outlives the job. It must stay before the
      # artifact upload: the report is scanned for secrets by make e2e before it can be uploaded.
      - name: Delete ephemeral e2e user and robot
        if: always()
        timeout-minutes: 5
        run: make e2e-teardown
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/console/playwright-report
          retention-days: 7

  dast:
    name: DAST (ZAP baseline)
    needs: deploy
    if: needs.deploy.outputs.console_url != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ needs.deploy.outputs.console_url }}
          rules_file_name: .zap/rules.tsv
          # The AJAX spider (-j) finds the SPA routes; the spider stops after 3 minutes.
          cmd_options: "-j -m 3"
          # Pinned by digest so a moving stable tag cannot change the scanner between runs.
          docker_name: ghcr.io/zaproxy/zaproxy:stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
          allow_issue_writing: false
          # Rollout (ADR 0070): the first main run reported only; its alerts are triaged in .zap/rules.tsv, so any new
          # alert now fails the job.
          fail_action: true
          artifact_name: zap-baseline
