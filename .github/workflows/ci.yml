# Quality gate run on every pull request and, through deploy.yml, before every deployment.
# Merging requires every job here to be green. On the GitHub Free plan this is a procedural rule
# (gh pr checks before gh pr merge), not a server-side required check (see ADR 0003).
# Not triggered by push: deploy.yml calls this workflow on main, so a push would run it twice.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only superseded PR runs are cancelled: a run called by deploy.yml on main must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript:
    name: TypeScript (lint, types, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - name: Protocol schemas and OpenAPI are up to date
        run: |
          pnpm --filter @mfc/protocol generate
          out="$(git status --porcelain -- packages/protocol/generated services/api/openapi.json)"
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::Generated files are stale: run pnpm generate and commit."
            exit 1
          fi
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-ts
          path: |
            apps/*/coverage/coverage-summary.json
            services/*/coverage/coverage-summary.json
            packages/*/coverage/coverage-summary.json
          retention-days: 7

  python:
    name: Python agent (lint, types, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy --strict src
      - run: uv run pytest --cov=fleet_agent --cov-report=term-missing --cov-fail-under=80

  terraform:
    name: Terraform (fmt, validate, tflint, checkov)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.17"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: Validate and test every root module without a backend
        run: |
          for dir in infra/bootstrap infra/envs/demo; do
            [ -d "$dir" ] || continue
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            terraform -chdir="$dir" test
          done
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - run: tflint --init && tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: bridgecrewio/checkov-action@c10e2438743528f9e4549758fad8b7a62052541d # v12.3136.0
        with:
          directory: infra
          framework: terraform
          quiet: true
          soft_fail: false
          skip_path: infra/.terraform
